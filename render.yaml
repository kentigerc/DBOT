services:
    - type: web
      name: netoacademy
      runtime: node
      plan: free
      buildCommand: npm ci --ignore-scripts && npm run build
      startCommand: npm run start:production
      healthCheckPath: /api/health
      envVars:
          - key: NODE_VERSION
            value: '24'
          - key: NETO_SESSION_SECRET
            generateValue: true
