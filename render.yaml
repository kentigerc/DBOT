services:
    - type: web
      name: netoacademy
      runtime: node
      plan: free
      buildCommand: npm ci && npm run build
      startCommand: npm run start:production
      healthCheckPath: /api/health
      envVars:
          - key: NODE_VERSION
            value: 20.20.1
          - key: NETO_SESSION_SECRET
            generateValue: true
          - key: NETO_ANALYSIS_ALLOW_REAL
            value: 'false'
