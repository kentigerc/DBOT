name: NetoAcademy CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: netoacademy-ci-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    build-and-test:
        name: Build and test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: neto
                    POSTGRES_PASSWORD: ci-test-only
                    POSTGRES_DB: neto_analytics
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U neto -d neto_analytics"
                    --health-interval 5s --health-timeout 5s --health-retries 10
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
                  cache: npm

            - name: Scan tracked source for common credential formats
              run: node scripts/check-secrets.cjs

            - name: Install locked dependencies
              run: npm ci

            - name: Test OAuth, WebSockets and PostgreSQL persistence
              env:
                  NETO_TEST_DATABASE_URL: postgresql://neto:ci-test-only@localhost:5432/neto_analytics
              run: npm run test:server

            - name: Test application
              run: npm test -- --ci --maxWorkers=2

            - name: Build production application
              run: npm run build
